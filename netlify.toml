[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# The dish photos are placeholders now and originals later, but either way the
# file name is the cache key: same name, new picture. Keep the browser cache
# short and let the CDN hold the resized variants.
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/order.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The kitchen screen shows the day's takings; it must not be indexed.
[[headers]]
  for = "/kuzhina.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
